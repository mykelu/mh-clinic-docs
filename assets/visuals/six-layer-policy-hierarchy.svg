    <rect x="42" y="270" width="96" height="22" rx="11" fill="#EBF4F0"/>
    <text x="90" y="285" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#1F5C48">RA 10173</text>
    <text x="42" y="312" class="font reg-t">Data Privacy Act</text>
    <text x="42" y="334" class="font reg-b">• PostgreSQL RLS tenant wall</text>
    <text x="42" y="352" class="font reg-b">• Read-audit on every route</text>
    <text x="42" y="370" class="font reg-b">• Break-glass two-person audit</text>
    <text x="42" y="388" class="font reg-b">• Zero-PII helpline &amp; k ≥ 5</text>
    <text x="42" y="406" class="font reg-b">• Configurable retention rules</text>
  </g>

  <g filter="url(#sp)">
    <rect x="288" y="256" width="244" height="176" rx="12" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="302" y="270" width="118" height="22" rx="11" fill="#FFE4E6"/>
    <text x="361" y="285" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#BE123C">RA 6675 &amp; DDB S2</text>
    <text x="302" y="312" class="font reg-t">Generics &amp; Controlled Rx</text>
    <text x="302" y="334" class="font reg-b">• Generic Name (Brand) format</text>
    <text x="302" y="352" class="font reg-b">• 17-item PH Starter Formulary</text>
    <text x="302" y="370" class="font reg-b">• PRC / PTR / S2 license gates</text>
    <text x="302" y="388" class="font reg-b">• Yellow Rx quantity guardrails</text>
    <text x="302" y="406" class="font reg-b">• Public QR authenticity check</text>
  </g>

  <g filter="url(#sp)">
    <rect x="548" y="256" width="244" height="176" rx="12" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="562" y="270" width="96" height="22" rx="11" fill="#EEF2FF"/>
    <text x="610" y="285" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#3730A3">RA 10029</text>
    <text x="562" y="312" class="font reg-t">PH Psychology Act</text>
    <text x="562" y="334" class="font reg-b">• Dual RPm + RPsy signatures</text>
    <text x="562" y="352" class="font reg-b">• 68 APA DSM-5-TR catalog</text>
    <text x="562" y="370" class="font reg-b">• Multi-index scorebooks</text>
    <text x="562" y="388" class="font reg-b">• Feedback-session release lock</text>
    <text x="562" y="406" class="font reg-b">• Supervision co-sign tracking</text>
  </g>

  <g filter="url(#sp)">
    <rect x="808" y="256" width="244" height="176" rx="12" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="822" y="270" width="154" height="22" rx="11" fill="#FEF3C7"/>
    <text x="899" y="285" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#92400E">RA 9994 / 10754 / BIR</text>
    <text x="822" y="312" class="font reg-t">Statutory Tax &amp; Billing</text>
    <text x="822" y="334" class="font reg-b">• Senior &amp; PWD 20% discount</text>
    <text x="822" y="352" class="font reg-b">• 12% VAT-exempt calculator</text>
    <text x="822" y="370" class="font reg-b">• HMO 10% Withholding Tax SI</text>
    <text x="822" y="388" class="font reg-b">• BIR Form 2307 attachment</text>
    <text x="822" y="406" class="font reg-b">• R27 / R28 reconciliation</text>
  </g>
