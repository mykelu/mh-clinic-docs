<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460" role="img" aria-label="6-Layer Policy Resolution Hierarchy and Philippine Regulatory Compliance">
  <defs>
    <style>
      .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #182420; }
      .sub { font-size: 13px; fill: #4B5D56; }
      .sec { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #1F5C48; }
      .l-num { font-size: 11px; font-weight: 800; fill: #FFFFFF; }
      .l-title { font-size: 13px; font-weight: 700; fill: #182420; }
      .l-desc { font-size: 11.5px; fill: #4B5D56; }
      .reg-t { font-size: 13px; font-weight: 700; fill: #182420; }
      .reg-b { font-size: 11.5px; fill: #3E4F49; }
    </style>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F5C48"/>
    </marker>
    <filter id="sp" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#182420" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="460" rx="16" fill="#F7F6F2" stroke="#DFDDD4" stroke-width="1.5"/>
  <text x="28" y="38" class="font title">6-Layer Policy Resolution Engine &amp; Philippine Regulatory Controls</text>
  <text x="28" y="58" class="font sub">Explicit inheritance with optimistic CAS (expectedRevision) and immutable audit receipts across every tenant</text>

  <!-- 6-Layer Cascade -->
  <text x="28" y="88" class="font sec">6-LAYER POLICY INHERITANCE CASCADE (MOST GENERAL → MOST SPECIFIC OVERRIDE)</text>

  <g filter="url(#sp)">
    <rect x="28" y="102" width="152" height="104" rx="10" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="40" y="114" width="58" height="20" rx="10" fill="#64748B"/><text x="69" y="128" text-anchor="middle" class="font l-num">LAYER 1</text>
    <text x="40" y="154" class="font l-title">Platform Default</text>
    <text x="40" y="172" class="font l-desc">Global safe baselines</text>
    <text x="40" y="188" class="font l-desc">(e.g. k ≥ 5, 24h notice)</text>
  </g>
  <line x1="180" y1="154" x2="195" y2="154" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-p)"/>

  <g filter="url(#sp)">
    <rect x="198" y="102" width="152" height="104" rx="10" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="210" y="114" width="58" height="20" rx="10" fill="#475569"/><text x="239" y="128" text-anchor="middle" class="font l-num">LAYER 2</text>
    <text x="210" y="154" class="font l-title">Brand / Tenant</text>
    <text x="210" y="172" class="font l-desc">Operating mode &amp;</text>
    <text x="210" y="188" class="font l-desc">WP-20 entitlements</text>
  </g>
  <line x1="350" y1="154" x2="365" y2="154" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-p)"/>

  <g filter="url(#sp)">
    <rect x="368" y="102" width="152" height="104" rx="10" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="380" y="114" width="58" height="20" rx="10" fill="#0F766E"/><text x="409" y="128" text-anchor="middle" class="font l-num">LAYER 3</text>
    <text x="380" y="154" class="font l-title">Branch / Site</text>
    <text x="380" y="172" class="font l-desc">Timezone, rooms &amp;</text>
    <text x="380" y="188" class="font l-desc">branch cutoff rules</text>
  </g>
  <line x1="520" y1="154" x2="535" y2="154" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-p)"/>

  <g filter="url(#sp)">
    <rect x="538" y="102" width="152" height="104" rx="10" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="550" y="114" width="58" height="20" rx="10" fill="#2E6F59"/><text x="579" y="128" text-anchor="middle" class="font l-num">LAYER 4</text>
    <text x="550" y="154" class="font l-title">Brand Program</text>
    <text x="550" y="172" class="font l-desc">HMO, IHC, or</text>
    <text x="550" y="188" class="font l-desc">specialty track rules</text>
  </g>
  <line x1="690" y1="154" x2="705" y2="154" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-p)"/>

  <g filter="url(#sp)">
    <rect x="708" y="102" width="152" height="104" rx="10" fill="#FFFFFF" stroke="#D7E2DC"/>
    <rect x="720" y="114" width="58" height="20" rx="10" fill="#1F5C48"/><text x="749" y="128" text-anchor="middle" class="font l-num">LAYER 5</text>
    <text x="720" y="154" class="font l-title">Service SKU</text>
    <text x="720" y="172" class="font l-desc">Duration, buffer,</text>
    <text x="720" y="188" class="font l-desc">credential &amp; channel</text>
  </g>
  <line x1="860" y1="154" x2="875" y2="154" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-p)"/>

  <g filter="url(#sp)">
    <rect x="878" y="102" width="174" height="104" rx="10" fill="#EBF4F0" stroke="#1F5C48" stroke-width="1.5"/>
    <rect x="890" y="114" width="58" height="20" rx="10" fill="#182420"/><text x="919" y="128" text-anchor="middle" class="font l-num">LAYER 6</text>
    <text x="890" y="154" class="font l-title">Clinician / Resource</text>
    <text x="890" y="172" class="font l-desc">Effective override wins</text>
    <text x="890" y="188" class="font l-desc">+ logged to /admin/audit</text>
  </g>

  <!-- Regulatory Matrix -->
  <text x="28" y="242" class="font sec">EMBEDDED PHILIPPINE REGULATORY COMPLIANCE CONTROLS</text>

  <g filter="url(#sp)">
