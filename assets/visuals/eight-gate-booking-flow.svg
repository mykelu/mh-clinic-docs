<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" width="1080" height="510" role="img" aria-label="8-Gate Booking Simulator and 7-Step Aventus HMO Workflow" aria-labelledby="title desc">
  <title id="title">8-Gate Booking Simulator and 7-Step Aventus HMO Referral-to-Settlement Lifecycle</title>
  <desc id="desc">Synthetic MH-Clinic diagram: 8-Gate Booking Simulator and 7-Step Aventus HMO Referral-to-Settlement Lifecycle. Full description in the surrounding document text.</desc>
  <defs>
    <style>
      .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #182420; }
      .sub { font-size: 13px; fill: #4B5D56; }
      .sec { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
      .g-num { font-size: 11px; font-weight: 800; fill: #FFFFFF; }
      .g-title { font-size: 13px; font-weight: 700; fill: #182420; }
      .g-desc { font-size: 11.5px; fill: #4B5D56; }
      .step-t { font-size: 12px; font-weight: 700; fill: #182420; }
      .step-b { font-size: 11px; fill: #4B5D56; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F5C48"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B45309"/>
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#182420" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="510" rx="16" fill="#F7F6F2" stroke="#DFDDD4" stroke-width="1.5"/>
  <text x="28" y="38" class="font title">Scheduling Governance: 8-Gate Booking Simulator &amp; 7-Step HMO Flow</text>
  <text x="28" y="58" class="font sub">Deterministic slot eligibility evaluation (WP-12) paired with audited Aventus HMO referral-to-remittance controls (WP-15)</text>

  <!-- Section A: 8-Gate Simulator -->
  <text x="28" y="88" class="font sec" fill="#1F5C48">PART A · 8-GATE BOOKING SIMULATOR (EVALUATED BEFORE EVERY HOLD OR CONFIRMATION)</text>

  <!-- Row 1 of Gates (1-4) -->
  <g filter="url(#sh)">
    <rect x="28" y="100" width="242" height="72" rx="10" fill="#FFFFFF" stroke="#CFE0D8"/>
    <circle cx="50" cy="124" r="11" fill="#1F5C48"/><text x="50" y="128" text-anchor="middle" class="font g-num">1</text>
    <text x="68" y="128" class="font g-title">Company &amp; Brand Scope</text>
    <text x="42" y="152" class="font g-desc">Active tenant, brand &amp; mode rules</text>
  </g>
  <line x1="270" y1="136" x2="287" y2="136" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <g filter="url(#sh)">
    <rect x="290" y="100" width="242" height="72" rx="10" fill="#FFFFFF" stroke="#CFE0D8"/>
    <circle cx="312" cy="124" r="11" fill="#1F5C48"/><text x="312" y="128" text-anchor="middle" class="font g-num">2</text>
    <text x="330" y="128" class="font g-title">Service &amp; Delivery Mode</text>
    <text x="304" y="152" class="font g-desc">Active SKU · In-person vs. Teleconsult</text>
  </g>
  <line x1="532" y1="136" x2="549" y2="136" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <g filter="url(#sh)">
    <rect x="552" y="100" width="242" height="72" rx="10" fill="#FFFFFF" stroke="#CFE0D8"/>
    <circle cx="574" cy="124" r="11" fill="#1F5C48"/><text x="574" y="128" text-anchor="middle" class="font g-num">3</text>
    <text x="592" y="128" class="font g-title">Room &amp; Equipment</text>
    <text x="566" y="152" class="font g-desc">Location capacity + pre/post buffers</text>
  </g>
  <line x1="794" y1="136" x2="811" y2="136" stroke="#1F5C48" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <g filter="url(#sh)">
    <rect x="814" y="100" width="238" height="72" rx="10" fill="#FFFFFF" stroke="#CFE0D8"/>
    <circle cx="836" cy="124" r="11" fill="#1F5C48"/><text x="836" y="128" text-anchor="middle" class="font g-num">4</text>
    <text x="854" y="128" class="font g-title">Clinician 6/6 Readiness</text>
    <text x="828" y="152" class="font g-desc">Verified license + brand assignment</text>
  </g>

