<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-label="Helpline Zero-PII and AG-UI AI Coordinator Guardrails">
  <defs>
    <style>
      .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 19px; font-weight: 700; fill: #182420; }
      .sub { font-size: 13px; fill: #4B5D56; }
      .sec { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; }
      .c-title { font-size: 13.5px; font-weight: 700; fill: #182420; }
      .c-body { font-size: 11px; fill: #3E4F49; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    </style>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE123C"/>
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3730A3"/>
    </marker>
    <filter id="s2" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#182420" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="480" rx="16" fill="#F7F6F2" stroke="#DFDDD4" stroke-width="1.5"/>
  <text x="28" y="38" class="font title">Wave 5 Safety Guardrails: Zero-PII Helpline (WP-31) &amp; AG-UI AI Co-Pilot (WP-32)</text>
  <text x="28" y="58" class="font sub">Deterministic crisis hard-stops, mandatory responder cooldowns, clinical RLS walls, and dual-consent scribing</text>

  <!-- Left Panel: WP-31 Anonymous Helpline -->
  <g filter="url(#s2)">
    <rect x="28" y="80" width="500" height="374" rx="14" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5"/>
    <rect x="28" y="80" width="500" height="44" rx="14" fill="#BE123C"/>
    <rect x="28" y="108" width="500" height="16" fill="#BE123C"/>
    <text x="48" y="107" class="font" font-size="14" font-weight="700" fill="#FFFFFF">WP-31 · Entitlement-Gated Anonymous Helpline</text>

    <!-- Step 1 -->
    <rect x="46" y="140" width="464" height="62" rx="10" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="60" y="160" class="font c-title">1. Zero-PII Gatekeeper (/helpline)</text>
    <text x="60" y="178" class="font c-body">Validates passcode or blinded token → issues <tspan font-weight="700">ANON-xxxx</tspan> + 4-digit PIN.</text>
    <text x="60" y="194" class="font mono" fill="#BE123C">scrubHelplinePii redacts emails &amp; PH mobile numbers before DB write</text>

    <!-- Branching arrow -->
    <line x1="150" y1="202" x2="150" y2="225" stroke="#BE123C" stroke-width="1.6" marker-end="url(#arr-r)"/>
    <line x1="390" y1="202" x2="390" y2="225" stroke="#BE123C" stroke-width="1.6" marker-end="url(#arr-r)"/>

    <!-- Unentitled deflection -->
    <rect x="46" y="228" width="222" height="114" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="60" y="248" class="font sec" fill="#BE123C">UNENTITLED VISITOR</text>
    <text x="60" y="268" class="font c-title">Instant Crisis Deflection</text>
    <text x="60" y="288" class="font c-body">• NCMH 1553 / 0917-899-8727</text>
    <text x="60" y="305" class="font c-body">• Hopeline 0917-558-4673</text>
    <text x="60" y="322" class="font c-body">• In Touch 0917-800-1123 · 911</text>

    <!-- Entitled Responder Desk -->
    <rect x="282" y="228" width="228" height="114" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="296" y="248" class="font sec" fill="#1F5C48">ENTITLED CALLER</text>
    <text x="296" y="268" class="font c-title">Responder Desk Triage</text>
    <text x="296" y="288" class="font c-body">• L1: Imminent Life Safety</text>
    <text x="296" y="305" class="font c-body">• L2/L3: Urgent Clinical Support</text>
    <text x="296" y="322" class="font c-body">• L4: Self-Guided / /learn Hub</text>

    <!-- Cooldown Guardrail -->
    <rect x="46" y="358" width="464" height="78" rx="10" fill="#182420"/>
    <text x="62" y="380" class="font" font-size="12.5" font-weight="700" fill="#FDA4AF">Responder Welfare Guardrail (PostgreSQL Enforced)</text>
    <text x="62" y="399" class="font" font-size="11" fill="#E2E8F0">Closing an L1 encounter automatically enforces a 15-minute mandatory</text>
    <text x="62" y="416" class="font" font-size="11" fill="#E2E8F0">post-L1 cooldown (helpline_responder_cooldowns) before next crisis.</text>
  </g>

  <!-- Right Panel: WP-32 AG-UI AI Coordinator & Telehealth -->
  <g filter="url(#s2)">
    <rect x="552" y="80" width="500" height="374" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="552" y="80" width="500" height="44" rx="14" fill="#3730A3"/>
    <rect x="552" y="108" width="500" height="16" fill="#3730A3"/>
    <text x="572" y="107" class="font" font-size="14" font-weight="700" fill="#FFFFFF">WP-32 · AG-UI AI Coordinator &amp; Telehealth Scribe</text>

    <!-- Inbound Crisis Check -->
    <rect x="570" y="140" width="464" height="62" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="584" y="160" class="font c-title">1. Deterministic Crisis Hard-Stop (Pre-LLM)</text>
    <text x="584" y="178" class="font c-body"><tspan font-weight="700">detectCrisisUtterance</tspan> checks every inbound message before AI runs.</text>
    <text x="584" y="194" class="font mono" fill="#BE123C">Match → halts booking &amp; transfers via STATE_DELTA to /staff/helpline-desk</text>

    <line x1="802" y1="202" x2="802" y2="225" stroke="#3730A3" stroke-width="1.6" marker-end="url(#arr-i)"/>

    <!-- HITL Modes + Hard RLS Wall -->
    <rect x="570" y="228" width="224" height="114" rx="10" fill="#F8FAFC" stroke="#C7D2FE"/>
    <text x="584" y="248" class="font sec" fill="#3730A3">AUTONOMY MODES</text>
    <text x="584" y="268" class="font c-title">HITL Default Safety</text>
    <text x="584" y="288" class="font c-body">• copilot_draft_only (Default)</text>
    <text x="584" y="305" class="font c-body">• bounded_autonomous</text>
    <text x="584" y="322" class="font c-body">• after_hours_overflow · off</text>

    <rect x="808" y="228" width="226" height="114" rx="10" fill="#FFF1F2" stroke="#FCA5A5"/>
    <text x="822" y="248" class="font sec" fill="#BE123C">HARD RLS WALL (403)</text>
    <text x="822" y="268" class="font c-title">Zero Clinical Access</text>
    <text x="822" y="288" class="font c-body">• session_notes: BLOCKED</text>
    <text x="822" y="305" class="font c-body">• 5Ps / MSE / C-SSRS: BLOCKED</text>
    <text x="822" y="322" class="font c-body">• eRx &amp; MedCerts: BLOCKED</text>

    <!-- Telehealth Dual-Consent -->
    <rect x="570" y="358" width="464" height="78" rx="10" fill="#1E293B"/>
    <text x="586" y="380" class="font" font-size="12.5" font-weight="700" fill="#A5B4FC">Native Telehealth Dual-Consent Ambient Scribe</text>
    <text x="586" y="399" class="font" font-size="11" fill="#E2E8F0">DB CHECK blocks scribing unless BOTH clinician &amp; client consent.</text>
    <text x="586" y="416" class="font" font-size="11" fill="#E2E8F0">Drafts stay watermarked unverified_ai_draft until clinician sign-off.</text>
  </g>
</svg>
