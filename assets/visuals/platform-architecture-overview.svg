<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="MH-Clinic Multi-Brand Platform Architecture Overview">
  <defs>
    <style>
      .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #182420; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #4B5D56; }
      .sec-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #1F5C48; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #182420; }
      .card-body { font-size: 11px; font-weight: 400; fill: #3E4F49; }
      .pill-text { font-size: 10.5px; font-weight: 600; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1F5C48"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#BE123C"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#182420" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect x="0" y="0" width="1120" height="620" rx="16" fill="#F7F6F2" stroke="#DFDDD4" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="24" y="20" width="34" height="34" rx="9" fill="#1F5C48"/>
  <text x="41" y="43" text-anchor="middle" class="font" font-size="18" font-weight="800" fill="#FFFFFF">M</text>
  <text x="70" y="36" class="font title">MH-Clinic Enterprise Architecture (WP-01 to WP-33)</text>
  <text x="70" y="54" class="font subtitle">Multi-tenant clinical, HMO, and institutional counseling platform · Database-enforced RLS &amp; k-anonymity (k ≥ 5)</text>

  <!-- Row 1: Public & Client Entrypoints -->
  <text x="28" y="88" class="font sec-label">1. PUBLIC &amp; SELF-SERVICE SURFACES</text>
  <g filter="url(#shadow)">
    <rect x="28" y="98" width="248" height="84" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <text x="42" y="122" class="font card-title">Brand Portals &amp; Sites</text>
    <text x="42" y="140" class="font mono" fill="#1F5C48">/sites/[company] · /client/[brand]</text>
    <text x="42" y="160" class="font card-body">Booking, Intake, Assessments, Lifestyle Rx</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="296" y="98" width="256" height="84" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <text x="310" y="122" class="font card-title">Anonymous Helpline (WP-31)</text>
    <text x="310" y="140" class="font mono" fill="#BE123C">/helpline · ANON-xxxx (Zero-PII)</text>
    <text x="310" y="160" class="font card-body">Passcode/Token Gate · PH Crisis Deflection</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="572" y="98" width="248" height="84" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <text x="586" y="122" class="font card-title">Learning Hub &amp; Verification</text>
    <text x="586" y="140" class="font mono" fill="#0F766E">/learn · /verify/document/[token]</text>
    <text x="586" y="160" class="font card-body">Psychoeducation · Public QR eRx/MedCert</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="840" y="98" width="252" height="84" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <text x="854" y="122" class="font card-title">Sponsor &amp; Partner Portals</text>
    <text x="854" y="140" class="font mono" fill="#3730A3">/sponsor-access · /hmo</text>
    <text x="854" y="160" class="font card-body">Aventus LOA Desk · k ≥ 5 Sponsor Reports</text>
  </g>

  <!-- Row 2: Auth & Verified Actor Security Gate -->
  <rect x="28" y="204" width="1064" height="54" rx="10" fill="#EBF4F0" stroke="#1F5C48" stroke-width="1.5"/>
  <text x="46" y="226" class="font card-title" fill="#1F5C48">VERIFIED ACTOR &amp; MANDATORY MFA BOUNDARY</text>
  <text x="46" y="244" class="font card-body">Google SSO · Passkeys (WebAuthn) · Staff Password + TOTP MFA · HMAC Actor Context Claim · 15m/30m Idle Lock · Read-Audit Gate</text>
  <rect x="920" y="217" width="156" height="28" rx="14" fill="#1F5C48"/>
  <text x="998" y="235" text-anchor="middle" class="font pill-text" fill="#FFFFFF">clinic.require_actor()</text>

  <!-- Arrows Row 1 -> Row 2 -->
  <line x1="152" y1="182" x2="152" y2="201" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="424" y1="182" x2="424" y2="201" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="696" y1="182" x2="696" y2="201" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="966" y1="182" x2="966" y2="201" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row 3: Role-Isolated Application Workspaces -->
  <text x="28" y="280" class="font sec-label">2. ROLE-ISOLATED NEXT.JS APP ROUTER WORKSPACES (ZERO CLINICAL LEAKAGE)</text>

  <g filter="url(#shadow)">
    <rect x="28" y="294" width="250" height="126" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <rect x="42" y="306" width="108" height="22" rx="11" fill="#FEF3C7"/>
    <text x="96" y="321" text-anchor="middle" class="font pill-text" fill="#92400E">OPERATIONS</text>
    <text x="42" y="346" class="font card-title">Scheduling, HMO &amp; CRM</text>
    <text x="42" y="364" class="font card-body">• 8-Gate Booking &amp; Waitlist</text>
    <text x="42" y="380" class="font card-body">• 7-Step Aventus HMO &amp; SOA</text>
    <text x="42" y="396" class="font card-body">• Inquiries, Outreach &amp; POS</text>
    <text x="42" y="412" class="font mono" fill="#BE123C">Notes/eRx: 403 Denied</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="298" y="294" width="256" height="126" rx="12" fill="#FFFFFF" stroke="#1F5C48" stroke-width="1.5"/>
    <rect x="312" y="306" width="118" height="22" rx="11" fill="#EBF4F0"/>
    <text x="371" y="321" text-anchor="middle" class="font pill-text" fill="#1F5C48">CLINICAL CARE</text>
    <text x="312" y="346" class="font card-title">Charting, Rx &amp; Specialty</text>
    <text x="312" y="364" class="font card-body">• SOAP/3 ↔ 5Ps &amp; 14-Domain MSE</text>
    <text x="312" y="380" class="font card-body">• RA 6675 eRx, C-SSRS, QR MedCert</text>
    <text x="312" y="396" class="font card-body">• 68 DSM-5-TR · RPm+RPsy · MD/RND/CMA</text>
    <text x="312" y="412" class="font mono" fill="#1F5C48">Assigned-care RLS enforced</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="574" y="294" width="248" height="126" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <rect x="588" y="306" width="128" height="22" rx="11" fill="#EEF2FF"/>
    <text x="652" y="321" text-anchor="middle" class="font pill-text" fill="#3730A3">IHC, CRISIS &amp; AI</text>
    <text x="588" y="346" class="font card-title">ABC Bank IHC, Helpline &amp; AI</text>
    <text x="588" y="364" class="font card-body">• Zero-Billing IHC &amp; MDT Hub</text>
    <text x="588" y="380" class="font card-body">• L1–L4 Desk + 15m Cooldown</text>
    <text x="588" y="396" class="font card-body">• AG-UI AI Co-Pilot + Telehealth</text>
    <text x="588" y="412" class="font mono" fill="#3730A3">Dual-consent Scribe · Crisis Stop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="294" width="250" height="126" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <rect x="856" y="306" width="126" height="22" rx="11" fill="#CCFBF1"/>
    <text x="919" y="321" text-anchor="middle" class="font pill-text" fill="#0F766E">ADMIN &amp; BI</text>
    <text x="856" y="346" class="font card-title">Governance &amp; Analytics</text>
    <text x="856" y="364" class="font card-body">• 6-Layer Policy Registry</text>
    <text x="856" y="380" class="font card-body">• SaaS Brands &amp; Formulary</text>
    <text x="856" y="396" class="font card-body">• R01–R30 + Report Studio</text>
    <text x="856" y="412" class="font mono" fill="#0F766E">CAS expectedRevision · Audit</text>
  </g>

  <!-- Short connector indicators Row 2 -> Row 3 (clear of section heading) -->
  <line x1="696" y1="258" x2="696" y2="291" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="966" y1="258" x2="966" y2="291" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Row 4: Data, Security & Connected Ecosystem -->
  <text x="28" y="452" class="font sec-label">3. DATABASE SECURITY BOUNDARY &amp; CONNECTED WORKSPACES</text>

  <g filter="url(#shadow)">
    <rect x="28" y="464" width="676" height="130" rx="12" fill="#182420"/>
    <text x="48" y="490" class="font" font-size="14.5" font-weight="700" fill="#FFFFFF">PostgreSQL 15/16 Security Engine (clinic_app + SECURITY DEFINER RPCs)</text>
    <text x="48" y="509" class="font" font-size="11.5" fill="#C7D7D0">Direct table access revoked by default · All mutations &amp; reads execute inside verified actor transactions</text>

    <rect x="48" y="524" width="148" height="54" rx="8" fill="#233730" stroke="#3B5B4F"/>
    <text x="60" y="544" class="font" font-size="11.5" font-weight="700" fill="#9EE6C8">Tenant RLS</text>
    <text x="60" y="562" class="font" font-size="10.5" fill="#D4E4DD">company_id &amp; brand_id</text>

    <rect x="208" y="524" width="152" height="54" rx="8" fill="#233730" stroke="#3B5B4F"/>
    <text x="220" y="544" class="font" font-size="11.5" font-weight="700" fill="#9EE6C8">Append-Only Audit</text>
    <text x="220" y="562" class="font" font-size="10.5" fill="#D4E4DD">Notes, Rx, Read Receipts</text>

    <rect x="372" y="524" width="144" height="54" rx="8" fill="#233730" stroke="#3B5B4F"/>
    <text x="384" y="544" class="font" font-size="11.5" font-weight="700" fill="#9EE6C8">SQL k-Anonymity</text>
    <text x="384" y="562" class="font" font-size="10.5" fill="#D4E4DD">Suppress if count &lt; 5</text>

    <rect x="528" y="524" width="156" height="54" rx="8" fill="#233730" stroke="#3B5B4F"/>
    <text x="540" y="544" class="font" font-size="11.5" font-weight="700" fill="#9EE6C8">Optimistic CAS</text>
    <text x="540" y="562" class="font" font-size="10.5" fill="#D4E4DD">expectedRevision + UUID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="724" y="464" width="368" height="130" rx="12" fill="#FFFFFF" stroke="#D7E2DC" stroke-width="1.2"/>
    <text x="742" y="490" class="font card-title">Connected Services &amp; Background Workers</text>
    <text x="742" y="510" class="font card-body">• Connected Accounting (Books, Journals, Close)</text>
    <text x="742" y="528" class="font card-body">• Connected CRM (Leads, Outreach, Pipeline)</text>
    <text x="742" y="546" class="font card-body">• Notification Sender &amp; Risk/Assessment Workers</text>
    <text x="742" y="564" class="font card-body">• Helpline Blinded Issuer &amp; Diagnostic Scan Workers</text>
    <text x="742" y="582" class="font mono" fill="#1F5C48">Scoped ticket handoff · Independent revocation</text>
  </g>

  <!-- Short connector indicators Row 3 -> Row 4 (clear of section heading) -->
  <line x1="650" y1="420" x2="650" y2="461" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="908" y1="420" x2="908" y2="461" stroke="#1F5C48" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
