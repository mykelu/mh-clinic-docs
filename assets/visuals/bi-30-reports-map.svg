  <!-- Bottom Privacy & Export Bar -->
  <rect x="28" y="362" width="668" height="74" rx="12" fill="#182420"/>
  <text x="48" y="388" class="font" font-size="13.5" font-weight="700" fill="#9EE6C8">Database-Enforced k-Anonymity Disclosure Floor (RA 10173)</text>
  <text x="48" y="408" class="font mono" fill="#E2E8F0">floor := greatest(5, clinic.sponsor_minimum_cohort_size(...))</text>
  <text x="48" y="424" class="font" font-size="11.5" fill="#CBD5E1">Slices with distinct_clients &lt; floor return status: 'suppressed' with NULL counts — zero re-identification.</text>

